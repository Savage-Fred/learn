  citation_bibtex: "@inproceedings {234962,\n\tauthor = {Ruoming Pang and Ramon Caceres\
    \ and Mike Burrows and Zhifeng Chen and Pratik Dave and Nathan Germer and Alexander\
    \ Golynski and Kevin Graney and Nina Kang and Lea Kissner and Jeffrey L. Korn\
    \ and Abhishek Parmar and Christina D. Richards and Mengzhi Wang},\n\ttitle =\
