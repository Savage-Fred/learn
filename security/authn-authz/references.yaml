- id: google-zanzibar-2019
  title: "Zanzibar: Google\u2019s Consistent, Global Authorization System"
  authors:
  - Ruoming Pang
  - "Ram\xF3n C\xE1ceres"
  - Mike Burrows
  - Alex Chen
  - Pratik Fimat
  - Carl A. Waldspurger
  - Kevin Goff
  - Sanjeev Kumar
  - Abhishek Parmar
  - Victor Sandberg
  - Sneha Trivedi
  year: 2019
  type: paper
  canonical_url: https://www.usenix.org/conference/atc19/presentation/pang
  citation_bibtex: "@inproceedings{pang2019zanzibar,\n  title={Zanzibar: Google's\
    \ Consistent, Global Authorization System},\n  author={Pang, Ruoming and C{\\\
    'a}ceres, Ram{\\'o}n and Burrows, Mike and Chen, Alex and Fimat, Pratik and Waldspurger,\
    \ Carl A and Goff, Kevin and Kumar, Sanjeev and Parmar, Abhishek and Sandberg,\
    \ Victor and Trivedi, Sneha},\n  booktitle={USENIX Annual Technical Conference\
    \ (ATC 19)},\n  pages={33--46},\n  year={2019}\n}"
  key_invariants:
  - External consistency eliminates the New-Enemy problem using Spanner timestamps
    and Zookies.
  - Relationship tuples define directed graph reachability for fine-grained permissions.
  - Leopard indexing layer caches set-reachability to guarantee sub-millisecond evaluation.
  role_relevance:
  - Track-3-Security
  - Track-1-SWE
  interview_calibration:
    company: Google / GDM
    level: L6
    round_type: Distributed Systems & Security Architecture
    prompt_summary: Design a globally distributed authorization system providing 99.999%
      availability, sub-millisecond latency, and external consistency for document
      ACL updates.
    expected_signals:
    - Articulates the New-Enemy problem and snapshot consistency bounds
    - Designs hierarchical caching and graph cycle detection
- id: oauth-2-1-draft
  title: The OAuth 2.1 Authorization Framework
  authors:
  - Dick Hardt
  - Aaron Parecki
  - Torsten Lodderstedt
  year: 2024
  type: rfc
  canonical_url: https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/
  citation_bibtex: "@misc{oauth21draft,\n  title={The OAuth 2.1 Authorization Framework},\n\
    \  author={Hardt, Dick and Parecki, Aaron and Lodderstedt, Torsten},\n  year={2024},\n\
    \  publisher={IETF OAuth Working Group}\n}"
  key_invariants:
  - PKCE is mandatory for all OAuth clients (confidential and public).
  - Implicit grant and resource owner password credentials are deprecated.
  - Refresh token rotation must invalidate previous tokens upon single use.
  role_relevance:
  - Track-3-Security
  - Track-1-SWE
  interview_calibration:
    company: OpenAI
    level: L5
    round_type: Systems Security
    prompt_summary: Design the authentication and authorization flow for third-party
      developer integrations connecting to user accounts via OAuth 2.1.
    expected_signals:
    - Mandates PKCE with code_challenge and code_verifier
    - Enforces refresh token rotation and token revocation endpoints
