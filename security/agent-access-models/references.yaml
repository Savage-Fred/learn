- id: hardy-confused-deputy-1988
  title: 'The Confused Deputy: (or why capabilities might have been invented)'
  authors:
  - Norm Hardy
  year: 1988
  type: paper
  canonical_url: https://dl.acm.org/doi/10.1145/54289.848243
  citation_bibtex: "@article{hardy1988confused,\n  title={The Confused Deputy: (or\
    \ why capabilities might have been invented)},\n  author={Hardy, Norm},\n  journal={ACM\
    \ SIGOPS Operating Systems Review},\n  volume={22},\n  number={4},\n  pages={36--38},\n\
    \  year={1988}\n}"
  key_invariants:
  - Ambient authority inevitably leads to the confused deputy vulnerability.
  - Capabilities bundle designation and authority into an unforgeable token.
  role_relevance:
  - Track-3-Security
  - Track-1-SWE
  interview_calibration:
    company: OpenAI
    level: L6
    round_type: Agent Platform Security Architecture
    prompt_summary: Design the access control and sandboxing layer for ChatGPT Operator
      / web-browsing agent executing arbitrary web interactions while authenticated
      to user services.
    expected_signals:
    - Identifies confused deputy risks when agent visits adversarial third-party web
      pages
    - Specifies per-domain cookie/session sandboxing and explicit user confirmation
      for state mutations
- id: rfc-8693-token-exchange
  title: 'RFC 8693: OAuth 2.0 Token Exchange'
  authors:
  - Michael B. Jones
  - Brian Campbell
  - Chuck Mortimore
  year: 2020
  type: rfc
  canonical_url: https://datatracker.ietf.org/doc/html/rfc8693
  citation_bibtex: "@misc{rfc8693,\n  title={OAuth 2.0 Token Exchange},\n  author={Jones,\
    \ Michael B and Campbell, Brian and Mortimore, Chuck},\n  year={2020},\n  publisher={IETF\
    \ RFC 8693}\n}"
  key_invariants:
  - Allows clients to exchange an existing security token for a new token with attenuated
    scope.
  - Tracks actor (the deputy) and subject (the original principal) in token claims.
  role_relevance:
  - Track-3-Security
  - Track-1-SWE
  interview_calibration:
    company: Google / GDM
    level: L5
    round_type: Identity & Delegation Architecture
    prompt_summary: Design an identity propagation protocol where a user delegates
      a task to an autonomous orchestrator, which invokes subagents.
    expected_signals:
    - Applies RFC 8693 with subject_token and actor_token claims
    - Enforces monotonic scope down-scoping
