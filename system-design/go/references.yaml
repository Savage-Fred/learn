- id: vyukov-go-scheduler-2012
  title: Scalable Go Scheduler Design Doc
  authors:
  - Dmitry Vyukov
  year: 2012
  type: tech_blog
  canonical_url: https://golang.org/s/go11sched
  citation_bibtex: "@misc{vyukov2012scheduler,\n  title={Scalable Go Scheduler Design\
    \ Doc},\n  author={Vyukov, Dmitry},\n  year={2012},\n  url={https://golang.org/s/go11sched}\n\
    }"
  key_invariants:
  - GMP scheduler decouples logical processors (P) from OS threads (M).
  - Work-stealing balances run queues across CPU cores without global lock contention.
