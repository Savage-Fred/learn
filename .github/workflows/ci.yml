name: Application tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEARN_USE_MOCK_LLM: "1"
      LEARN_DATA_DIR: ${{ runner.temp }}/learn-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install application and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run production application tests
        run: python -m pytest -q app/tests
      - name: Check tests leave the checkout unchanged
        run: |
          git status --porcelain > "$RUNNER_TEMP/learn-git-status"
          cat "$RUNNER_TEMP/learn-git-status"
          test ! -s "$RUNNER_TEMP/learn-git-status"
