  authors:
  - Yury A. Malkov
  - Dmitry A. Yashunin
  year: 2018
  type: paper
  canonical_url: https://ieeexplore.ieee.org/document/8594632
  citation_bibtex: "@article{malkov2018efficient,\n  title={Efficient and robust approximate\
    \ nearest neighbor search using Hierarchical Navigable Small World graphs},\n\
    \  author={Malkov, Yury A and Yashunin, Dmitry A},\n  journal={IEEE Transactions\
    \ on Pattern Analysis and Machine Intelligence},\n  volume={42},\n  number={4},\n\
    \  pages={824--836},\n  year={2018},\n  publisher={IEEE}\n}"
  key_invariants:
  - Multi-layer proximity graphs enable logarithmic O(log N) nearest neighbor search.
  - Heuristic edge selection maintains small-world navigability across high clustering.
