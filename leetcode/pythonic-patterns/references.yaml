  - Jukka Lehtosalo
  - "\u0141ukasz Langa"
  year: 2018
  type: rfc
  canonical_url: https://peps.python.org/pep-0544/
  citation_bibtex: "@misc{pep544protocols,\n  title={PEP 544 -- Protocols: Structural\
    \ subtyping},\n  author={Levkivskyi, Ivan and Lehtosalo, Jukka and Langa, \\L{}ukasz},\n\
    \  year={2018},\n  url={https://peps.python.org/pep-0544/}\n}"
