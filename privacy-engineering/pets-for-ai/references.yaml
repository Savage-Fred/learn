  role_relevance:
  - Track-2-Privacy
  - Track-4-Research-Eng
  interview_calibration:
    company: OpenAI
    level: L5
    round_type: AI Safety & Privacy Systems
    prompt_summary: Explain how training data extraction attacks exploit memorization
      in LLMs and evaluate mitigations during pre-training vs post-training.
    expected_signals:
    - Articulates deduplication of training datasets as the highest-leverage defense
    - Analyzes DP-SGD trade-offs on model perplexity and training throughput
