[project]
name = "learn"
version = "0.1.0"
description = "Local-first technical learning and L4-L6 interview preparation platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Will McCarty", email = "wpm1414@gmail.com" }
]
keywords = [
    "learning",
    "interview-preparation",
    "system-design",
    "leetcode",
    "security",
    "privacy-engineering",
    "fastapi",
    "mcp"
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
learn = "app.main:cli"
learn-server = "app.main:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests", "tests", "tests_e2e"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: fast unit tests",
    "integration: integration tests with mock harnesses or SQLite",
    "e2e: end-to-end full platform workflows",
    "slow: tests taking >5 seconds",
]
