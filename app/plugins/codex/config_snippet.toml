# ==============================================================================
# Savage-Fred / Learn MCP Configuration Snippet for OpenAI Codex
# ==============================================================================
# Paste into ~/.codex/config.toml to enable Learn MCP tools in Codex / Astra / Sol.
#
# Mode 1: Stdio Transport (Default, invokes standalone Python process)
[mcp_servers.learn]
command = "python3"
args = ["-m", "app.mcp"]
cwd = "/home/will/dev/learn"

[mcp_servers.learn.env]
PYTHONPATH = "/home/will/dev/learn"
LEARN_DATA_DIR = "/home/will/.local/share/learn"

# Mode 2: SSE Transport (Active when FastAPI web server is running on port 8795)
# [mcp_servers.learn_sse]
# url = "http://127.0.0.1:8795/sse"
